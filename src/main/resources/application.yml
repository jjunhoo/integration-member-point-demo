server:
  port: 8080

spring:
  application:
    name: membership-service

  # ------------------------------------------------------------------
  # 데모용 인메모리 DB. 운영 환경에서는 Master DB(MySQL/Oracle)로 교체한다.
  # ------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:membership;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ------------------------------------------------------------------
  # Kafka (EDA) 설정
  # ------------------------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # at-least-once 보장을 위한 강한 내구성 설정
      acks: all
      retries: 3
      properties:
        enable.idempotence: true            # 프로듀서 멱등성 → 중복 발행 방지
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: membership-view-sync
      auto-offset-reset: latest
      enable-auto-commit: false             # 수동 커밋(정확한 처리 이후 커밋)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual                      # 수동 ack (컨테이너 팩토리에서 오버라이드)

# ------------------------------------------------------------------
# Redisson (분산 락 + Cache-Aside 뷰) 설정
# ------------------------------------------------------------------
redisson:
  address: ${REDIS_ADDRESS:redis://127.0.0.1:6379}

# ------------------------------------------------------------------
# 애플리케이션 커스텀 설정 (토픽/락 파라미터)
# ------------------------------------------------------------------
retail:
  membership:
    kafka:
      domain-event-topic: membership.domain-event.v1
      # DLQ(Dead Letter Queue) 토픽: 최종 실패 메시지 이관 대상
      # ※ Kafka/Spring 문서에서는 DLT(Dead Letter Topic)라고도 부르며, 개념은 동일하다.
      dlq-topic: membership.domain-event.v1.DLQ
    lock:
      wait-time-ms: 3000      # 락 획득 대기 시간
      lease-time-ms: 5000     # 락 점유(자동 해제) 시간
  # ------------------------------------------------------------------
  # 인증(JWT) 설정
  # ------------------------------------------------------------------
  auth:
    jwt:
      # 데모용 시크릿. 운영에서는 반드시 환경변수/시크릿 매니저로 주입한다. (HS256 → 256bit 이상)
      secret: ${JWT_SECRET:retail-membership-demo-super-secret-key-change-me-please-1234567890}
      issuer: retail-membership
      access-token-validity-seconds: 1800        # 30분
      refresh-token-validity-seconds: 1209600     # 14일
  # ------------------------------------------------------------------
  # 소셜 로그인 provider 설정 (확장 가능: 항목 추가만으로 provider 확장)
  # ------------------------------------------------------------------
  social:
    kakao:
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      user-info-uri: https://openapi.naver.com/v1/nid/me
    apple:
      # Apple 은 id_token(JWT) 검증 방식. 운영은 JWKS(https://appleid.apple.com/auth/keys) 서명 검증 필요.
      issuer: https://appleid.apple.com
      audience: ${APPLE_CLIENT_ID:com.retail.app}

# ------------------------------------------------------------------
# Resilience4j Retry (Consumer 일시 오류 대응)
# ------------------------------------------------------------------
resilience4j:
  retry:
    instances:
      membership-view-sync:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.redisson.client.RedisConnectionException
          - java.io.IOException

logging:
  level:
    com.retail.membership: DEBUG
