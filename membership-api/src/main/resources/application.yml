server:
  port: 8080

spring:
  application:
    name: membership-service

  # ------------------------------------------------------------------
  # Docker Compose 생명주기 (spring-boot-docker-compose, developmentOnly)
  # bootRun 시작 시 up → 종료 시 down. 이미 떠 있는 컨테이너가 있으면
  # Boot 가 up/down 을 건너뛰므로, 수동으로 띄운 경우엔 수동 down 필요.
  # ------------------------------------------------------------------
  docker:
    compose:
      # 루트 docker-compose.yml (모듈 cwd = membership-api)
      file: ../docker-compose.yml
      lifecycle-management: start-and-stop
      stop:
        command: down
        timeout: 1m

  # ------------------------------------------------------------------
  # 데모용 파일 H2 (+ AUTO_SERVER). API·Batch 가 같은 DB 파일을 공유한다.
  # 운영 환경에서는 Master DB(MySQL/Oracle)로 교체한다.
  # ------------------------------------------------------------------
  datasource:
    # bootRun cwd = membership-api → 저장소 루트 data/ 공유
    url: jdbc:h2:file:../data/membership;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # 로컬 조회용. 앱 기동 중 http://localhost:8080/h2-console
  # JDBC URL 은 위 datasource.url 과 동일해야 같은 DB 를 본다.
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ------------------------------------------------------------------
  # Kafka (EDA) 설정
  # ------------------------------------------------------------------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # at-least-once 보장을 위한 강한 내구성 설정
      acks: all
      retries: 3
      properties:
        enable.idempotence: true            # 프로듀서 멱등성 → 중복 발행 방지
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: membership-view-sync
      auto-offset-reset: latest
      enable-auto-commit: false             # 수동 커밋(정확한 처리 이후 커밋)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual                      # 수동 ack (컨테이너 팩토리에서 오버라이드)

# ------------------------------------------------------------------
# Redisson (분산 락 + Cache-Aside 뷰) 설정
# ------------------------------------------------------------------
redisson:
  address: ${REDIS_ADDRESS:redis://127.0.0.1:6379}

# ------------------------------------------------------------------
# 애플리케이션 커스텀 설정 (토픽/락 파라미터)
# ------------------------------------------------------------------
retail:
  membership:
    kafka:
      domain-event-topic: membership.domain-event.v1
      # DLQ(Dead Letter Queue) 토픽: 최종 실패 메시지 이관 대상
      # ※ Kafka/Spring 문서에서는 DLT(Dead Letter Topic)라고도 부르며, 개념은 동일하다.
      dlq-topic: membership.domain-event.v1.DLQ
    lock:
      wait-time-ms: 3000      # 락 획득 대기 시간
      lease-time-ms: 5000     # 락 점유(자동 해제) 시간
  # ------------------------------------------------------------------
  # 인증(JWT) 설정
  # ------------------------------------------------------------------
  auth:
    jwt:
      # 데모용 시크릿. 운영에서는 반드시 환경변수/시크릿 매니저로 주입한다. (HS256 → 256bit 이상)
      secret: ${JWT_SECRET:retail-membership-demo-super-secret-key-change-me-please-1234567890}
      issuer: retail-membership
      access-token-validity-seconds: 1800        # 30분
      refresh-token-validity-seconds: 1209600     # 14일
  # ------------------------------------------------------------------
  # 소셜 로그인 provider 설정 (확장 가능: 항목 추가만으로 provider 확장)
  # ------------------------------------------------------------------
  social:
    kakao:
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      # 네이버 개발자센터 Client ID/Secret. 로컬은 환경변수로 주입한다.
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      redirect-uri: ${NAVER_REDIRECT_URI:http://127.0.0.1:5173/auth/naver/callback}
      authorize-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
    apple:
      # Apple 은 id_token(JWT) 검증 방식. 운영은 JWKS(https://appleid.apple.com/auth/keys) 서명 검증 필요.
      issuer: https://appleid.apple.com
      audience: ${APPLE_CLIENT_ID:com.retail.app}

# ------------------------------------------------------------------
# Resilience4j Retry (Consumer 일시 오류 대응)
# ------------------------------------------------------------------
resilience4j:
  retry:
    instances:
      membership-view-sync:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.redisson.client.RedisConnectionException
          - java.io.IOException

logging:
  level:
    com.retail.membership: DEBUG
