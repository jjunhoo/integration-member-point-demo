services:
  # ---------------------------------------------------------------
  # Redis : 분산 락(RLock) + Cache-Aside 뷰(RBucket) 저장소
  # ---------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: membership-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  # ---------------------------------------------------------------
  # Kafka (KRaft 모드, 단일 브로커) : 도메인 이벤트 전파
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: membership-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft (Zookeeper 미사용) 단일 노드 구성
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # 호스트 앱(API): 127.0.0.1:9092 / 컨테이너(Kafka UI): kafka:29092
      KAFKA_LISTENERS: "PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # 데모 단일 브로커이므로 복제/토픽 관련 파라미터를 1로 완화
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------
  # Kafka UI : 토픽/파티션/컨슈머 그룹 대시보드 (로컬 전용)
  # http://localhost:8081
  # ---------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: membership-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
