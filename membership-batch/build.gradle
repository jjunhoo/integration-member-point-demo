plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':membership-common')

    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'

    runtimeOnly 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
}

// 배치도 local 프로필로 공유 DB/시크릿 설정을 읽는다.
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active',
            System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
    systemProperty 'MEMBERSHIP_H2_FILE',
            "${rootProject.projectDir.absolutePath}/data/membership"
}
